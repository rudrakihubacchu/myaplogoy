<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Himu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }

        .content {
            z-index: 10;
            position: relative;
            padding: 20px;
        }

        h1, h2 {
            font-family: 'Dancing Script', cursive;
            color: #d81b60;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.7);
        }

        h1 { font-size: 4.5rem; }
        h2 { font-size: 3.5rem; }

        p {
            font-size: 1.5rem;
            color: #ad1457;
            font-weight: 500;
        }

        .hidden {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 1.5s ease-in-out;
        }

        .show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .falling-item {
            position: absolute;
            top: -10vh;
            animation: fall linear infinite;
            user-select: none;
            z-index: 1;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .heart {
            width: 60px;
            height: 60px;
            background-color: #ff3366;
            position: relative;
            transform: rotate(-45deg);
            margin: 40px auto;
            animation: heartbeat 1.2s infinite;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
        }

        .heart::before,
        .heart::after {
            content: "";
            width: 60px;
            height: 60px;
            background-color: #ff3366;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before { top: -30px; left: 0; }
        .heart::after { top: 0; left: 30px; }

        @keyframes heartbeat {
            0%, 40%, 80%, 100% { transform: scale(1) rotate(-45deg); }
            20% { transform: scale(1.25) rotate(-45deg); }
            60% { transform: scale(1.15) rotate(-45deg); }
        }

        #upload-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }

        #video-upload { display: none; }

        #upload-label {
            background-color: rgba(255, 255, 255, 0.6);
            color: #ad1457;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        #upload-label:hover { background-color: rgba(255, 255, 255, 0.9); }

        .glow-text {
            font-size: 1.2rem;
            color: #fff;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 0 0 5px #ff3366, 0 0 10px #ff3366, 0 0 20px #ff3366, 0 0 40px #ff3366;
            animation: glow 1s infinite alternate;
            cursor: pointer;
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px #ff3366, 0 0 10px #ff3366, 0 0 20px #ff3366; }
            to { text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366, 0 0 30px #ff3366, 0 0 50px #ff3366; }
        }

        #clickable-heart { cursor: pointer; z-index: 20; }

        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #apology-video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Changed from cover to contain to fix the zoom issue */
        }

        #close-video {
            position: absolute;
            top: 20px;
            right: 30px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            z-index: 101;
        }
    </style>
</head>
<body>
    <div id="upload-container">
        <input type="file" id="video-upload" accept="video/*">
        <label for="video-upload" id="upload-label">Upload Video 📁</label>
    </div>

    <div id="flower-container"></div>
    
    <div class="content">
        <h1 id="text1" class="hidden">Hey meri gudiya raani himu... ❤️</h1>
        <h2 id="text2" class="hidden" style="display: none;">Gussa kiu ho baccha? 🥺</h2>
        
        <div id="apology-box" class="hidden" style="display: none;">
            <h2>I am really sorry!</h2>
            <p>Please smile now, it breaks my heart to see you angry. 🌸</p>
            <div class="heart" id="clickable-heart"></div>
            <p id="click-instruction" class="glow-text">Click the heart ✨</p>
        </div>
    </div>

    <div id="video-overlay" style="display: none;">
        <video id="apology-video" playsinline></video>
        <button id="close-video">✖</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const text1 = document.getElementById("text1");
    const text2 = document.getElementById("text2");
    const apologyBox = document.getElementById("apology-box");

    const videoUpload = document.getElementById("video-upload");
    const uploadLabel = document.getElementById("upload-label");
    const videoOverlay = document.getElementById("video-overlay");
    const apologyVideo = document.getElementById("apology-video");
    const clickableHeart = document.getElementById("clickable-heart");
    const closeVideo = document.getElementById("close-video");

    // Point the video source to the server file
    let videoUrl = "/static/apology_video.mp4";
    apologyVideo.src = videoUrl;

    // Send the video to the server when uploaded
    videoUpload.addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (file) {
            uploadLabel.innerText = "Uploading to Server... ⏳";
            
            const formData = new FormData();
            formData.append("video", file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    uploadLabel.innerText = "Video Saved Everywhere ✔️";
                    // Add timestamp to force the browser to load the newest upload
                    videoUrl = "/static/apology_video.mp4?t=" + new Date().getTime();
                    apologyVideo.src = videoUrl;
                } else {
                    uploadLabel.innerText = "Upload Failed ❌";
                }
            } catch (error) {
                uploadLabel.innerText = "Error ❌";
            }
        }
    });

    // Handle Click on Heart
    clickableHeart.addEventListener("click", () => {
        videoOverlay.style.display = "block";
        apologyVideo.volume = 1.0;
        
        // Try playing the video from the server
        apologyVideo.play().catch(() => {
            alert("Video hasn't been uploaded to the server yet! Please upload one first.");
            videoOverlay.style.display = "none";
        });
    });

    // Close Video Player
    closeVideo.addEventListener("click", () => {
        videoOverlay.style.display = "none";
        apologyVideo.pause();
    });

    // Sequence the text animations
    setTimeout(() => {
        text1.classList.remove("hidden");
        text1.classList.add("show");
    }, 1000); 

    setTimeout(() => {
        text1.classList.remove("show");
        text1.classList.add("hidden");
    }, 4500); 

    setTimeout(() => {
        text1.style.display = 'none'; 
        text2.style.display = 'block';
        
        setTimeout(() => {
            text2.classList.remove("hidden");
            text2.classList.add("show");
        }, 50);
    }, 6000); 

    setTimeout(() => {
        text2.classList.remove("show");
        text2.classList.add("hidden");
    }, 9500);

    setTimeout(() => {
        text2.style.display = 'none';
        apologyBox.style.display = 'block';
        
        setTimeout(() => {
            apologyBox.classList.remove("hidden");
            apologyBox.classList.add("show");
        }, 50);
    }, 11000); 

    // Continuous Falling Flowers and Hearts Generator
    function createFallingItem() {
        const item = document.createElement('div');
        item.classList.add('falling-item');
        
        const emojis = ['🌸', '🌺', '💖', '🌷', '✨', '🤍', '🌹'];
        item.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        
        item.style.left = Math.random() * 100 + 'vw';
        item.style.animationDuration = Math.random() * 3 + 3 + 's'; 
        item.style.fontSize = Math.random() * 20 + 15 + 'px'; 
        item.style.opacity = Math.random() * 0.5 + 0.5;
        
        document.getElementById('flower-container').appendChild(item);

        setTimeout(() => {
            item.remove();
        }, 6000);
    }

    setInterval(createFallingItem, 250);
});
    </script>
</body>
</html>
